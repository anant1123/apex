services:
  - type: web
    name: apex-web
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m spacy download en_core_web_sm"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_CHAT_MODEL
        value: qwen/qwen3-32b
      - key: GROQ_SUMMARY_MODEL
        value: qwen/qwen3-32b
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: apex_db
      - key: FLASK_SECRET_KEY
        generateValue: true
