<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}A.P.E.X.{% endblock %} — Artificial Processing Educational eXpert</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <polygon points="20,2 35,11 35,29 20,38 5,29 5,11" fill="none" stroke="#3b82f6" stroke-width="1.4"/>
      <polygon points="20,10 29,15 29,25 20,30 11,25 11,15" fill="none" stroke="#06b6d4" stroke-width="1.4"/>
      <circle cx="20" cy="20" r="2.6" fill="#06b6d4"/>
    </svg>
    <span>A.P.E.X.<span class="brand-sub">Artificial Processing Educational eXpert</span></span>
  </div>

  <nav class="tabs">
    <a href="{{ url_for('notes_page') }}" class="{{ 'active' if active == 'notes' }}">Notes</a>
    <a href="{{ url_for('chat_page') }}" class="{{ 'active' if active == 'chat' }}">Tutor</a>
    <a href="{{ url_for('progress_page') }}" class="{{ 'active' if active == 'progress' }}">Progress</a>
    <a href="{{ url_for('history_page') }}" class="{{ 'active' if active == 'history' }}">History</a>
  </nav>

  {% if session.get('user_id') %}
  <div class="user-menu">
    <a href="{{ url_for('profile_page') }}" class="user-chip {{ 'active' if active == 'profile' }}">
      <span class="avatar-dot">{{ session.get('user_name', '?')[0]|upper }}</span>
      <span class="user-chip-name">{{ session.get('user_name', 'Account') }}</span>
    </a>
    <form action="{{ url_for('logout') }}" method="post">
      <button type="submit" class="btn ghost logout-btn">Logout</button>
    </form>
  </div>
  {% endif %}
</div>

<main class="shell">
  {% block content %}{% endblock %}
</main>

{% block scripts %}{% endblock %}
</body>
</html>
