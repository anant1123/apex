{% extends "base.html" %}
{% block title %}Enter code{% endblock %}

{% block content %}
<section class="panel auth-panel">
  <h1>Check your inbox</h1>
  <p class="lede">We sent a 6-digit code to <strong>{{ email }}</strong>. It expires in a few minutes.</p>

  {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
  {% if info %}<div class="hint" style="color:var(--green); margin-bottom:14px;">{{ info }}</div>{% endif %}

  <form method="post" autocomplete="one-time-code">
    <div class="field">
      <label for="code">6-digit code</label>
      <input type="text" id="code" name="code" class="otp-input" required autofocus
             inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="••••••">
    </div>
    <div class="btn-row">
      <button type="submit" class="btn primary">Verify &amp; log in</button>
    </div>
  </form>

  <form method="post" action="{{ url_for('verify_resend') }}" class="auth-switch">
    <button type="submit" class="btn ghost" style="padding:6px 14px; font-size:12px;">Resend code</button>
  </form>
  <p class="hint auth-switch"><a href="{{ url_for('login_page') }}">Use a different email</a></p>
</section>
{% endblock %}
