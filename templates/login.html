{% extends "base.html" %}
{% block title %}Log in{% endblock %}

{% block content %}
<section class="panel auth-panel">
  <h1>Welcome back</h1>
  <p class="lede">Log in to reach your notes, tutor conversations, and progress.</p>

  {% if error %}<div class="error-box">{{ error }}</div>{% endif %}

  <form method="post" autocomplete="on">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required value="{{ email or '' }}" autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
    </div>
    <div class="btn-row">
      <button type="submit" class="btn primary">Log in</button>
    </div>
  </form>

  <p class="hint auth-switch">New here? <a href="{{ url_for('register_page') }}">Create an account</a></p>
</section>
{% endblock %}
